  <circle cx="32" cy="32" r="20" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
  <!-- Portal gate arc top -->
  <path d="M 14 32 A 18 18 0 0 1 50 32" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
