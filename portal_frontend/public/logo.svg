  <!-- Shield/lock center -->
  <path d="M32 20 L38 23 L38 31 C38 35.4 35.2 39.4 32 41 C28.8 39.4 26 35.4 26 31 L26 23 Z" fill="#6366f1" opacity="0.9"/>
